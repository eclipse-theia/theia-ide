name: Build Theia IDE Next Release (Linux)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-5" # Runs every weekday at 2am UTC

jobs:
  build:
    name: Build Next Release (Linux only)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Export build variables
        shell: bash
        run: |
          # Build against the version currently published under the Theia `next` dist tag, e.g.
          # 1.76.0-next.0, and publish the IDE as a dated pre-release of the same upcoming release.
          THEIA_NEXT=$(npm view @theia/core@next version)
          if [ -z "$THEIA_NEXT" ]; then
            echo "Could not resolve the version published under the Theia 'next' dist tag." >&2
            exit 1
          fi
          echo "THEIA_VERSION=${THEIA_NEXT}" >> $GITHUB_ENV
          echo "THEIA_IDE_VERSION=${THEIA_NEXT%%-*}-next-$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build next package
        shell: bash
        run: |
          yarn --skip-integrity-check --network-timeout 100000
          yarn release:prepare --theia $THEIA_VERSION --ide $THEIA_IDE_VERSION
          yarn build:extensions
          yarn build:applications:next
          yarn download:plugins
          yarn package:applications:next
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test (Linux)
        run: xvfb-run -a yarn --cwd applications/electron-next test

      - name: Upload Linux Dist Files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: theia-ide-next-linux
          path: |
            applications/electron-next/dist/TheiaIDENext.AppImage
            applications/electron-next/dist/TheiaIDENext.deb
          retention-days: 7

      - name: Publish to rolling next release
        shell: bash
        run: |
          # Delete existing next release if present
          gh release delete next --yes --cleanup-tag 2>/dev/null || true
          # Create a new pre-release with the next tag
          gh release create next \
            --title "Next Build - Ubuntu AppImage & .deb (${{ env.THEIA_IDE_VERSION }})" \
            --notes "Automated next build of the Ubuntu AppImage and .deb from \`master\` ($(date -u '+%Y-%m-%d %H:%M UTC'))." \
            --prerelease \
            --target ${{ github.sha }} \
            applications/electron-next/dist/TheiaIDENext.AppImage \
            applications/electron-next/dist/TheiaIDENext.deb \
            applications/electron-next/dist/latest-linux.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
